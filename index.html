<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>99 Names of Allah</title>
<meta name="description" content="The 99 Names of Allah explained simply, with Quran, hadith, stories and everyday examples.">
<meta name="theme-color" content="#faf8f4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23166a55'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='white'%3E%D8%A7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1d1b18;--mute:#7a746b;--line:#e8e3da;--acc:#166a55;--accbg:#e4f1ec;
--fs:20px;--pad:24px;--lh:1.7;--body:'Newsreader',Georgia,serif;--ui:'Inter',system-ui,sans-serif;--ar:'Amiri','Noto Naskh Arabic','Geeza Pro',serif}
:root[data-theme=dark]{--bg:#121413;--card:#1b1e1c;--ink:#ece8df;--mute:#8d9790;--line:#2b302d;--acc:#6fcfb0;--accbg:#1f2e29}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);transition:background .2s,color .2s}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:64px}
.bar h1{flex:1;margin:0;font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:56px;height:56px;border-radius:16px;border:0;background:transparent;display:grid;place-items:center;font-size:22px;font-weight:600}
.ib:active{background:var(--accbg)}
.ib svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sp{width:56px}
main{max-width:760px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
/* list */
.lead{text-align:center;padding:28px 0 20px}
.lead .a{font-family:var(--ar);font-size:44px;line-height:1.4;color:var(--acc)}
.lead p{margin:4px 0 0;color:var(--mute);font-size:15px}
.grid{display:grid;gap:12px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.grp{grid-column:1/-1;margin:26px 4px 2px;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.grp:first-child{margin-top:4px}
.card{display:flex;align-items:center;gap:14px;min-height:104px;padding:16px 20px;background:var(--card);border:1px solid var(--line);border-radius:22px;transition:transform .08s,border-color .15s}
.card:active{transform:scale(.98);border-color:var(--acc)}
.card .num{font-size:13px;font-weight:600;color:var(--mute);min-width:24px}
.card .t{flex:1;min-width:0}
.card .tr{font-size:19px;font-weight:600;line-height:1.3}
.card .m{font-size:14px;color:var(--mute);margin-top:4px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ar{font-family:var(--ar);font-size:34px;line-height:1.5;color:var(--acc);text-align:right;direction:rtl;max-width:48%}
.card.ok{border-color:var(--acc);background:var(--accbg)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.card.ok .chk{background:var(--acc);border-color:var(--acc)}
.chk svg{width:16px;height:16px;stroke:var(--bg);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.card.ok .chk svg{opacity:1}
.prog{margin:16px auto 0;max-width:320px}
.prog .tx{font-size:14px;font-weight:600;color:var(--mute);margin-bottom:8px}
.prog .bg{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog .fl{height:100%;background:var(--acc);border-radius:4px;transition:width .3s}
.disc{margin-top:28px;font-family:var(--ui);font-size:13px;color:var(--mute);line-height:1.5}
.tabs{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px 10px}
.tabs:empty{display:none}
.tabs a{min-height:52px;border-radius:16px;display:grid;place-items:center;font-size:16px;font-weight:600;color:var(--mute);background:var(--bg);border:1px solid var(--line)}
.tabs a.on{background:var(--accbg);color:var(--acc);border-color:var(--acc)}
.card.d{display:grid;grid-template-columns:24px 1fr;column-gap:14px;row-gap:2px;align-items:center;padding:18px 20px}
.card.d .t{grid-column:2}
.card.d .ar{grid-column:2;max-width:100%;text-align:right;font-size:28px;line-height:1.7;margin-top:6px}
/* reader */
.read{padding:0 var(--pad)}
.hero{text-align:center;padding:36px 0 28px;border-bottom:1px solid var(--line);margin-bottom:28px}
.hero .ar{font-family:var(--ar);font-size:calc(var(--fs)*3.2);line-height:1.5;color:var(--acc);direction:rtl}
.hero .tr{font-family:var(--ui);font-weight:600;font-size:calc(var(--fs)*1.2);margin-top:6px}
.hero .m{font-family:var(--body);font-style:italic;color:var(--mute);font-size:calc(var(--fs)*.9);margin-top:6px}
.hero .k{font-size:13px;font-weight:600;color:var(--mute);letter-spacing:.08em;margin-bottom:6px}
.prose{font-family:var(--body);font-size:var(--fs);line-height:var(--lh);hyphens:auto;-webkit-hyphens:auto}
.prose p{margin:0 0 1.1em}
.prose p.nt{font-size:.85em;color:var(--mute)}
.prose h3{font-family:var(--ui);font-size:.62em;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);margin:2em 0 .6em}
.prose blockquote{margin:0 0 1.1em;padding:.1em 0 .1em 1em;border-left:4px solid var(--acc);font-style:italic}
.hero .ar.sm{font-size:calc(var(--fs)*2.1);line-height:1.7}
.prose strong{font-weight:600}
.lines{margin-top:.4em}
.ln{padding:1.1em 0;border-bottom:1px solid var(--line)}
.ln:last-child{border-bottom:0}
.dar{font-family:var(--ar);font-size:calc(var(--fs)*1.75);line-height:1.9;direction:rtl;text-align:right}
.dm{font-family:var(--body);font-size:var(--fs);line-height:var(--lh);margin-top:.15em}
.dt{font-family:var(--ui);font-size:calc(var(--fs)*.68);color:var(--mute);font-style:italic;line-height:1.5;margin-top:.4em}
.cnt{display:inline-block;font-family:var(--ui);font-style:normal;font-size:.72em;font-weight:600;color:var(--acc);background:var(--accbg);border-radius:8px;padding:.1em .55em;margin-right:.5em}
.ltop{display:flex;align-items:center;gap:12px}
.ltop .dar{flex:1;min-width:0}
.spk{width:52px;height:52px;flex:none;border-radius:50%;border:2px solid var(--acc);background:transparent;color:var(--acc);display:grid;place-items:center;padding:0}
.spk svg,.pall svg{width:22px;height:22px;fill:currentColor}
.spk.playing{background:var(--acc);color:var(--bg)}
.ln.hl{background:var(--accbg);border-radius:18px;margin:0 -14px;padding-left:14px;padding-right:14px;border-bottom-color:transparent}
.audio{display:flex;flex-wrap:wrap;gap:10px;margin:.2em 0 .5em}
.pall{flex:1 1 230px;min-height:60px;border-radius:20px;border:2px solid var(--acc);background:var(--acc);color:var(--bg);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.pall.on{background:transparent;color:var(--acc)}
.audio .seg{flex:1 1 200px}
.ahint{font-family:var(--ui);font-size:13px;color:var(--mute);line-height:1.5;margin:.2em 0 .6em}
.ln.ask{font-family:var(--body);font-size:var(--fs);line-height:var(--lh);color:var(--acc);font-weight:600;padding:1.1em 0 1.1em 1em;border-left:4px solid var(--acc);border-bottom:0;margin:.6em 0}
.learn{width:100%;min-height:68px;margin-top:32px;border-radius:22px;border:2px solid var(--acc);background:transparent;color:var(--acc);font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.learn.on{background:var(--acc);color:var(--bg)}
.learn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:36px}
.pn a,.pn span{min-height:76px;border-radius:20px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;justify-content:center;padding:12px 18px}
.pn a:active{border-color:var(--acc)}
.pn small{font-size:12px;color:var(--mute);font-weight:600}
.pn b{font-size:17px}
.pn .nx{text-align:right;align-items:flex-end}
.pn span{opacity:.35}
/* settings sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:560px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;border:1px solid var(--line);border-bottom:0}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.row{margin:14px 0}
.row label{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--mute);margin-bottom:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--bg);padding:6px;border-radius:18px}
.seg button{min-height:52px;border:0;border-radius:13px;background:transparent;font-size:16px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.step{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center}
.step button{height:56px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:600}
.step button:active{background:var(--accbg)}
input[type=range]{width:100%;height:56px;accent-color:var(--acc);margin:0}
.done{width:100%;min-height:56px;border:0;border-radius:18px;background:var(--acc);color:var(--bg);font-size:17px;font-weight:600;margin-top:10px}
</style>
</head>
<body>
<header class="top"><div class="bar" id="bar"></div><nav class="tabs" id="tabs"></nav></header>
<main id="app"></main>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-label="Reading settings">
  <div class="grab"></div>
  <div class="row"><label>Theme</label>
    <div class="seg" data-k="theme"><button data-v="light">Light</button><button data-v="dark">Dark</button><button data-v="auto">Auto</button></div></div>
  <div class="row"><label>Text size <span id="fsv"></span></label>
    <div class="step"><button id="fsm" aria-label="Smaller">A−</button><input type="range" id="fs" min="15" max="34" step="1"><button id="fsp" aria-label="Larger">A+</button></div></div>
  <div class="row"><label>Side padding <span id="pdv"></span></label>
    <input type="range" id="pd" min="0" max="72" step="2"></div>
  <div class="row"><label>Line spacing <span id="lhv"></span></label>
    <input type="range" id="lh" min="1.4" max="2.2" step="0.05"></div>
  <div class="row"><label>Font</label>
    <div class="seg" data-k="font"><button data-v="serif">Serif</button><button data-v="sans">Sans</button></div></div>
  <button class="done" id="done">Done</button>
</section>
<script src="d/s.js"></script><script src="d/dua.js"></script>
<script>
const S=window.S;
const DU=window.DUA;
const $=s=>document.querySelector(s);
const defaults={theme:'auto',fs:20,pd:24,lh:1.7,font:'serif',rate:'slow'};
let P={...defaults};
try{Object.assign(P,JSON.parse(localStorage.getItem('n99prefs')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('n99prefs',JSON.stringify(P))}catch(e){}};
/* learned marks (same key as before, so existing marks are kept) */
const LKEY='n99learned_s';
let L=new Set();
try{L=new Set(JSON.parse(localStorage.getItem(LKEY)||'[]'))}catch(e){}
const saveL=()=>{try{localStorage.setItem(LKEY,JSON.stringify([...L]))}catch(e){}};
try{localStorage.removeItem('n99learned')}catch(e){}  /* old key from a removed feature */
const count=()=>[...L].filter(i=>i>=1&&i<=S.length).length;
const inl=t=>t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
const paras=a=>a.map(t=>`<p>${inl(t)}</p>`).join('');
/* tabs are shown on the two home lists only; readers pass null to hide them */
const tabs=a=>{$('#tabs').innerHTML=a?`<a href="#/" class="${a==='n'?'on':''}">Names of Allah</a><a href="#/dua" class="${a==='d'?'on':''}">Dua</a>`:''};
const sbody=b=>b.map(x=>`<h3>${x.h}</h3>`+x.t.split('\n').map(l=>l.startsWith('> ')?`<blockquote>${inl(l.slice(2))}</blockquote>`:l.startsWith('Note: ')?`<p class="nt">${inl(l)}</p>`:`<p>${inl(l)}</p>`).join('')).join('');
const grp=(i,t)=>i%10===0?`<div class="grp">${i+1}–${Math.min(i+10,t)}</div>`:'';
const gy=h=>{try{return +sessionStorage.getItem('y'+h)||0}catch(e){return 0}};
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const AA='<svg viewBox="0 0 24 24"><path d="M4 19 9 5l5 14M6 14h6M15 19l3-8 3 8M16 17h4"/></svg>';
const BACK='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
const mq=matchMedia('(prefers-color-scheme: dark)');
function apply(){
  const dark=P.theme==='dark'||(P.theme==='auto'&&mq.matches);
  const r=document.documentElement;
  r.dataset.theme=dark?'dark':'light';
  r.style.setProperty('--fs',P.fs+'px');r.style.setProperty('--pad',P.pd+'px');r.style.setProperty('--lh',P.lh);
  r.style.setProperty('--body',P.font==='serif'?"'Newsreader',Georgia,serif":"'Inter',system-ui,sans-serif");
  document.querySelector('meta[name=theme-color]').content=dark?'#121413':'#faf8f4';
  $('#fs').value=P.fs;$('#pd').value=P.pd;$('#lh').value=P.lh;
  $('#fsv').textContent=P.fs+'px';$('#pdv').textContent=P.pd+'px';$('#lhv').textContent=(+P.lh).toFixed(2);
  document.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',P[s.dataset.k]===b.dataset.v)));
}
mq.addEventListener('change',apply);
document.querySelectorAll('.seg').forEach(s=>s.onclick=e=>{const b=e.target.closest('button');if(b){P[s.dataset.k]=b.dataset.v;save();apply()}});
const bind=(id,k,f=Number)=>$(id).oninput=e=>{P[k]=f(e.target.value);save();apply()};
bind('#fs','fs');bind('#pd','pd');bind('#lh','lh');
$('#fsm').onclick=()=>{P.fs=Math.max(15,P.fs-1);save();apply()};
$('#fsp').onclick=()=>{P.fs=Math.min(34,P.fs+1);save();apply()};
const sheet=v=>document.body.classList.toggle('open',v);
$('#scrim').onclick=$('#done').onclick=()=>sheet(false);
addEventListener('keydown',e=>{if(e.key==='Escape')sheet(false)});

const bar=(left,title)=>{$('#bar').innerHTML=`${left}<h1>${title}</h1><button class="ib" id="aa" aria-label="Reading settings">${AA}</button>`;$('#aa').onclick=()=>sheet(true)};
function list(){
  document.title='99 Names of Allah';
  tabs('n');
  bar('<span class="sp"></span>','99 Names of Allah');
  const c=count();
  $('#app').innerHTML=`<div class="lead"><div class="a">أسماء الله الحسنى</div><p>Simple explanations, stories and examples</p><div class="prog"><div class="tx">${c} of ${S.length} learned</div><div class="bg"><div class="fl" style="width:${c/S.length*100}%"></div></div></div></div>
  <div class="grid">${S.map((n,i)=>grp(i,S.length)+`<a class="card${L.has(n.n)?' ok':''}" href="#/s/${n.n}"><span class="num">${n.n}</span><span class="t"><div class="tr">${n.tr}</div><div class="m">${n.m}</div></span><span class="ar" lang="ar">${n.ar}</span><span class="chk">${CHECK}</span></a>`).join('')}</div><p class="disc">Written with AI for easy reading. Names follow the commonly used list of 99; scholars differ slightly on the exact list. Please check sources and ask a scholar for anything you are unsure of.</p>`;
  scrollTo(0,gy('#/'));
}
function name(i){
  const n=S[i-1];if(!n)return list();
  tabs(null);
  document.title=n.tr+' — 99 Names';
  bar(`<a class="ib" href="#/" aria-label="Back">${BACK}</a>`,n.tr);
  const pv=S[i-2],nx=S[i];
  $('#app').innerHTML=`<div class="read"><div class="hero"><div class="k">${n.n} / ${S.length}</div><div class="ar" lang="ar">${n.ar}</div><div class="tr">${n.tr}</div><div class="m">${n.m}</div></div>
  <div class="prose">${sbody(n.b)}</div>
  <button class="learn${L.has(n.n)?' on':''}" id="lb" aria-pressed="${L.has(n.n)}">${CHECK}<span>${L.has(n.n)?'Learned':'Mark as learned'}</span></button>
  <p class="disc">Written with AI for easy reading. Please check sources and ask a scholar for rulings or anything you are unsure of.</p>
  <div class="pn">${pv?`<a href="#/s/${pv.n}"><small>← Previous</small><b>${pv.tr}</b></a>`:'<span></span>'}${nx?`<a class="nx" href="#/s/${nx.n}"><small>Next →</small><b>${nx.tr}</b></a>`:'<span></span>'}</div></div>`;
  $('#lb').onclick=()=>{L.has(n.n)?L.delete(n.n):L.add(n.n);saveL();const on=L.has(n.n);$('#lb').classList.toggle('on',on);$('#lb').setAttribute('aria-pressed',on);$('#lb span').textContent=on?'Learned':'Mark as learned'};
  scrollTo(0,0);
}
function dlist(){
  document.title='Dua — 99 Names of Allah';
  tabs('d');
  bar('<span class="sp"></span>','Dua');
  $('#app').innerHTML=`<div class="lead"><div class="a">الدعاء</div><p>Duas from the hadith, line by line</p></div>
  <div class="grid">${DU.map(d=>`<a class="card d" href="#/dua/${d.n}"><span class="num">${d.n}</span><span class="t"><div class="tr">${d.title}</div><div class="m">${d.ref}</div></span><span class="ar" lang="ar">${d.ar}</span></a>`).join('')}</div><p class="disc">Written with AI for easy reading. Please check sources and ask a scholar for rulings or anything you are unsure of.</p>`;
  scrollTo(0,gy('#/dua'));
}
/* ---- audio: reads the Arabic lines aloud with the device's own Arabic voice ---- */
const TTS=window.speechSynthesis&&window.SpeechSynthesisUtterance?window.speechSynthesis:null;
const RATES={slow:.6,normal:.9};
const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const STOP='<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
const NOVOICE='No Arabic voice was found on this device. iPhone: Settings, Accessibility, Spoken Content, Voices, Arabic. Android: Settings, System, Languages, Text-to-speech, install Arabic. Then reload this page.';
let spk={id:0,idx:-1,all:false,timer:0};
const arVoice=()=>{if(!TTS)return null;const v=TTS.getVoices().filter(x=>/^ar/i.test(x.lang));return v.find(x=>/^ar[-_]SA$/i.test(x.lang))||v[0]||null};
function voiceHint(){const h=$('#vhint');if(h)h.textContent=TTS&&!arVoice()?NOVOICE:''}
if(TTS)TTS.onvoiceschanged=voiceHint;
function markAudio(){
  document.querySelectorAll('.ln[data-i]').forEach(el=>el.classList.toggle('hl',+el.dataset.i===spk.idx));
  document.querySelectorAll('.spk').forEach(b=>{const on=+b.dataset.i===spk.idx;b.classList.toggle('playing',on);b.innerHTML=on?STOP:PLAY;b.setAttribute('aria-label',on?'Stop':'Play this line')});
  const pa=$('#pall');if(pa){pa.classList.toggle('on',spk.all);pa.innerHTML=(spk.all?STOP:PLAY)+`<span>${spk.all?'Stop':'Listen to the full dua'}</span>`}
}
function stopAudio(){
  spk.id++;clearTimeout(spk.timer);spk.all=false;spk.idx=-1;
  if(TTS)TTS.cancel();
  markAudio();
}
/* says line i of dua d, then calls after() */
function sayLine(d,i,after){
  const v=arVoice();
  if(!v){stopAudio();voiceHint();return}
  const my=spk.id;spk.idx=i;markAudio();
  if(spk.all){const el=document.querySelector(`.ln[data-i="${i}"]`);if(el&&el.scrollIntoView)el.scrollIntoView({block:'center',behavior:'smooth'})}
  const u=new SpeechSynthesisUtterance(d.lines[i].ar);
  u.voice=v;u.lang=v.lang;u.rate=RATES[P.rate]||RATES.slow;
  const done=()=>{if(my===spk.id)after()};
  u.onend=done;u.onerror=done;
  if(TTS.speaking||TTS.pending)TTS.cancel();
  TTS.speak(u);
}
function playOne(d,i){
  const was=spk.idx===i&&!spk.all;
  stopAudio();
  if(!was)sayLine(d,i,()=>{spk.idx=-1;markAudio()});
}
function playAll(d){
  const wasAll=spk.all;
  stopAudio();
  if(wasAll)return;
  const order=d.lines.map((l,i)=>l.ar&&!l.skip?i:-1).filter(i=>i>=0);
  let k=0;spk.all=true;
  const next=()=>{
    if(!spk.all)return;
    if(k>=order.length){stopAudio();return}
    sayLine(d,order[k++],()=>{spk.timer=setTimeout(next,900)});
  };
  next();
}
function dua(i){
  const d=DU[i-1];if(!d)return dlist();
  tabs(null);
  document.title=d.title+' — Dua';
  bar(`<a class="ib" href="#/dua" aria-label="Back">${BACK}</a>`,d.title);
  const pv=DU[i-2],nx=DU[i];
  const lines=d.lines.map((l,idx)=>l.step?`<div class="ln ask">${inl(l.step)}</div>`:`<div class="ln" data-i="${idx}"><div class="ltop">${TTS?`<button class="spk" data-i="${idx}" aria-label="Play this line">${PLAY}</button>`:''}<div class="dar" lang="ar">${l.ar}</div></div><div class="dm">${l.x?`<span class="cnt">× ${l.x}</span>`:''}${inl(l.m)}</div><div class="dt">${l.t}</div></div>`).join('');
  const audio=TTS?`<div class="audio"><button class="pall" id="pall">${PLAY}<span>Listen to the full dua</span></button><div class="seg" id="rate" data-k="rate"><button data-v="slow">Slow</button><button data-v="normal">Normal</button></div></div><p class="ahint" id="vhint"></p><p class="ahint">The voice is your device’s computer voice, not a reciter. Use it as a guide, and check the exact pronunciation with a teacher.</p>`:'';
  $('#app').innerHTML=`<div class="read"><div class="hero"><div class="k">${d.n} / ${DU.length}</div><div class="ar sm" lang="ar">${d.ar}</div><div class="tr">${d.title}</div><div class="m">${d.ref}</div></div>
  <div class="prose"><h3>The hadith</h3>${paras(d.hadith)}<h3>Explanation</h3>${paras(d.explain)}<h3>The dua, line by line</h3></div>
  ${audio}
  <div class="lines">${lines}</div>
  <p class="disc">${d.src}</p>
  <p class="disc">Written with AI for easy reading. Please check sources and ask a scholar for rulings or anything you are unsure of.</p>
  <div class="pn">${pv?`<a href="#/dua/${pv.n}"><small>← Previous</small><b>${pv.title}</b></a>`:'<span></span>'}${nx?`<a class="nx" href="#/dua/${nx.n}"><small>Next →</small><b>${nx.title}</b></a>`:'<span></span>'}</div></div>`;
  if(TTS){
    document.querySelectorAll('.spk').forEach(b=>b.onclick=()=>playOne(d,+b.dataset.i));
    $('#pall').onclick=()=>playAll(d);
    const rs=$('#rate'),sync=()=>rs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',P.rate===b.dataset.v));
    rs.onclick=e=>{const b=e.target.closest('button');if(b){P.rate=b.dataset.v;save();sync()}};
    sync();voiceHint();setTimeout(voiceHint,1200);
  }
  scrollTo(0,0);
}
/* any other hash (including old links) shows the names list */
function route(){
  stopAudio();
  const h=location.hash;
  if(h.startsWith('#/s/'))name(+h.slice(4));
  else if(h.startsWith('#/dua/'))dua(+h.slice(6));
  else if(h==='#/dua')dlist();
  else list();
}
/* remember where you were in a list when you open a card */
$('#app').addEventListener('click',e=>{if(e.target.closest('a.card'))try{sessionStorage.setItem('y'+(location.hash||'#/'),scrollY)}catch(_){}});
addEventListener('hashchange',route);
apply();route();
</script>
